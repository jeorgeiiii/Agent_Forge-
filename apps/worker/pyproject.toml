[project]
name = "agentforge-worker"
version = "0.1.0"
description = "Temporal graph execution worker for AgentForge"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "httpx>=0.27",
    "jinja2>=3.1",
    "temporalio>=1.8",
]

[tool.uv.sources]
agentforge-core = { path = "../core", editable = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "workflow", "activities", "templating", "ssrf", "api_client"]
