[project]
name = "agentforge-core"
version = "0.1.0"
description = "Shared, dependency-free AgentForge logic: node registry, expression engine, runtime helpers"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge_core*"]
