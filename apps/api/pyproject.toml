[project]
name = "agentforge-api"
version = "0.2.0"
description = "AgentForge graph orchestration API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "temporalio>=1.8",
    "httpx>=0.27",
    "redis>=5.0",
    "cryptography>=43",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # file uploads (multipart/form-data)
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]  # STORAGE_BACKEND=s3 (AWS S3, Cloudflare R2, MinIO)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "moto[s3]>=5", "aiosmtpd>=1.4", "boto3>=1.34"]

[tool.uv.sources]
agentforge-core = { path = "../core", editable = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
