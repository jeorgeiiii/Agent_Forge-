[project]
name = "agentforge-api"
version = "0.2.0"
description = "AgentForge graph orchestration API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentforge-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "temporalio>=1.8",
    "httpx>=0.27",
    "redis>=5.0",
    "cryptography>=43",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
agentforge-core = { path = "../core", editable = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
